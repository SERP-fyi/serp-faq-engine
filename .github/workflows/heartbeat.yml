name: Heartbeat
on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check FAQ engine and update heartbeat
        run: |
          python -m faq_engine "what is serp.fyi" > /dev/null
          COUNT=$(python -c "import faq_engine; print(len(faq_engine.FAQS))")
          HASH=$(sha256sum dataset/serp_faqs.csv | cut -d' ' -f1)
          {
            echo "SERP.fyi FAQ Engine heartbeat"
            echo "Last update: $(date -u +%Y-%m-%d)"
            echo "FAQs: $COUNT"
            echo "Dataset SHA-256: $HASH"
          } > heartbeat.txt
          cat heartbeat.txt

      - name: Commit heartbeat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heartbeat.txt
          git diff --cached --quiet || git commit -m "chore: heartbeat update $(date -u +%Y-%m-%d)"
          git push
